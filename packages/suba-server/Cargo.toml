[package]
name = "suba-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
default = ["toml"]
toml = ["dep:toml"]
json = []
singbox = ["suba-core/singbox"]
singbox-core = ["suba-core/singbox-core", "dep:suba-singbox"]
clash = ["suba-core/clash"]

[dependencies]
suba-core = { workspace = true }
suba-singbox = { workspace = true, optional = true }

argon2 = { workspace = true }
axum = { workspace = true }
axum-extra = { workspace = true }
chrono = { workspace = true }
ed25519-dalek = { workspace = true }
garde = { workspace = true }
http = { workspace = true }
http-serde = { workspace = true }
jsonwebtoken = { workspace = true }
getrandom = { workspace = true }
reqwest = { workspace = true }
rustix = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true, optional = true }
tower-http = { workspace = true }
tracing-subscriber = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }

[dev-dependencies]
# For the sing-box store's tests, which install a release archive they build
# themselves rather than fetching one.
flate2 = { workspace = true }
tar = { workspace = true }
