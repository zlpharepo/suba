<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SubA</title>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { min-height: 100vh; display: grid; place-items: center; margin: 0; }
  main { width: min(22rem, calc(100vw - 3rem)); }
  h1 { font-size: 1.25rem; font-weight: 600; }
  button { padding: .6rem 1rem; border: 0; border-radius: .5rem; background: #6b5cff; color: white; font: inherit; cursor: pointer; }
  button:disabled { opacity: .55; cursor: wait; }
  p { font-size: .875rem; }
</style>
<main>
  <h1>SubA Web</h1>
  <button id="install" type="button">Install Web</button>
  <p id="status" role="status"></p>
</main>
<script>
  const button = document.getElementById("install");
  const status = document.getElementById("status");
  button.addEventListener("click", async () => {
    button.disabled = true;
    status.textContent = "Downloading Web…";
    try {
      const response = await fetch("/api/system/web", { method: "POST" });
      if (!response.ok) {
        const error = await response.json();
        throw new Error(error.message || "Installation failed");
      }
      location.reload();
    } catch (error) {
      status.textContent = error.message;
      button.disabled = false;
    }
  });
</script>
</html>
