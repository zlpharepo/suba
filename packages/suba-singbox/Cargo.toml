[package]
name = "suba-singbox"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
# Both capabilities are on by default: this crate is used by a build that ships
# them together. Either alone is `--no-default-features --features render` or
# `--features core`, which is how the two are proven independent.
default = ["render", "core"]
# Writing nodes as the documents sing-box reads. Pure: no clock, no file, no
# socket, and no installed core.
render = []
# Knowing and installing the sing-box versions this machine can run. Needs the
# network, the filesystem and processes; needs nothing from `render` to do it.
core = ["dep:regex", "dep:reqwest", "dep:rustix"]

[dependencies]
suba-proto = { workspace = true }
serde_json = { workspace = true }

flate2 = { workspace = true }
regex = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
rustix = { workspace = true, optional = true }
serde = { workspace = true }
sha2 = { workspace = true }
tar.workspace = true
thiserror = { workspace = true }

[dev-dependencies]
