[package]
name = "suba"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
# `toml`/`json` pick the configuration file format and are mutually exclusive.
# `singbox` adds the sing-box document format: it links the dialect crate, and
# the dialect is called from the format registry that the capability list reads.
# `clash` adds the clash document format the same way.
default = ["toml"]
toml = ["suba-server/toml"]
json = ["suba-server/json"]
singbox = ["suba-server/singbox"]
# `singbox-core` adds running the core itself: installing a version, assembling
# the configuration and starting the process.
singbox-core = ["suba-server/singbox-core"]
clash = ["suba-server/clash"]

[dependencies]
suba-server = { workspace = true }

clap = { version = "4.5.41", features = ["derive"] }
tokio = { workspace = true }
