[package]
name = "suba"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
# `toml`/`json` pick the configuration file format and are mutually exclusive.
# `singbox` adds the sing-box document format: it links the dialect crate, and
# the dialect is called from the format registry that the capability list reads.
default = ["toml"]
toml = ["suba-server/toml"]
json = ["suba-server/json"]
singbox = ["suba-server/singbox"]

[dependencies]
suba-server = { workspace = true }

clap = { version = "4.5.41", features = ["derive"] }
tokio = { workspace = true }
