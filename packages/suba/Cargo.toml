[package]
name = "suba"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
# `toml`/`json` pick the configuration file format and are mutually exclusive.
# The `clash`/`singbox` dialects are not wired yet, so there is no feature for
# them: a flag that links a crate nothing calls compiles a build that behaves
# exactly like one without it.
default = ["toml"]
toml = ["suba-server/toml"]
json = ["suba-server/json"]

[dependencies]
suba-server = { workspace = true }

clap = { version = "4.5.41", features = ["derive"] }
tokio = { workspace = true }
